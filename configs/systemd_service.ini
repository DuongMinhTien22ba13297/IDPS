# Systemd Service Configuration for AutoDefense Daemon
# Status: PLACEHOLDER — Will be configured in Phase 3.
#
# Copy this file to: /etc/systemd/system/autodefense.service
# Then run:
#   sudo systemctl daemon-reload
#   sudo systemctl enable autodefense
#   sudo systemctl start autodefense

[Unit]
Description=Zero-Touch IDPS AutoDefense Daemon
After=network.target suricata.service
Wants=suricata.service

[Service]
Type=simple
User=root
WorkingDirectory=/opt/auto_idps
ExecStart=/opt/auto_idps/venv/bin/python /opt/auto_idps/src/autodefense_daemon.py
Restart=always
RestartSec=5
StandardOutput=journal
StandardError=journal

[Install]
WantedBy=multi-user.target
